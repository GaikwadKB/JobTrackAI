# Project-wide Gradle settings.

# JVM heap for the Gradle daemon. Bumped up because Room/Hilt KSP + Compose
# compilation is memory-hungry on larger modules.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Run independent modules' tasks in parallel — this project has 20 modules,
# parallel execution meaningfully speeds up local + CI builds.
org.gradle.parallel=true

# Reuse the Gradle daemon and cache configuration between builds.
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required — all Jetpack libraries assume it.
android.useAndroidX=true

# Kotlin code style used by the official Kotlin IDE formatter.
kotlin.code.style=official

# Disable unused build features per-module rather than globally; keeps the
# base Android block lean and makes each module's build.gradle.kts explicit
# about what it needs (see core/designsystem, feature/* for buildFeatures).
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
