[versions]
# --- Build tooling ---
agp = "8.13.0"
kotlin = "2.2.20"
ksp = "2.2.20-1.0.28"

# --- AndroidX core ---
coreKtx = "1.15.0"
lifecycle = "2.9.0"
activityCompose = "1.10.0"
appcompat = "1.7.0"

# --- Compose ---
composeBom = "2025.10.00"

# --- Navigation ---
navigationCompose = "2.9.0"

# --- DI ---
hilt = "2.56"
hiltNavigationCompose = "1.2.0"

# --- Room ---
room = "2.7.0"

# --- DataStore ---
datastore = "1.1.2"

# --- WorkManager ---
workManager = "2.10.0"
hiltWork = "1.2.0"

# --- Networking ---
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
coilCompose = "2.7.0"

# --- Coroutines ---
coroutines = "1.9.0"

# --- Firebase ---
firebaseBom = "33.7.0"
googleServices = "4.4.2"
crashlyticsPlugin = "3.0.2"

# --- Testing ---
junit4 = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"
mockk = "1.13.13"
turbine = "1.2.0"
coroutinesTest = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
